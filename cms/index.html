<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      iframe, body {
        width: 100vw;
        height: 100vh;
      }
      iframe {
        border: 0;
        padding: 0;
        margin: 0;
      }
      html, body {
        margin: 0;
      }
      button {
        background: black;
        color: white;
        padding: 0.8rem;
      }
    </style>
  </head>
  <body>
    <iframe data-tab-content src="/cms/admin/?1" ></iframe>
    <iframe data-tab-content src="/cms/admin/?2" ></iframe>
    <iframe data-tab-content src="/cms/admin/?3" ></iframe>
    <iframe data-tab-content src="/cms/admin/?4" ></iframe>
    <script>
      window._tabs = document.querySelectorAll("[data-tab-content]")

      if (window.innerWidth > window.innerHeight)
        document.body.style.display = "flex"
      
    </script>
    <div style="position: fixed; bottom: 8.5rem; left: 0; font-size: 20px">
      <button onclick="window.scrollTo(0, window.innerHeight * 0)">1</button>
    </div>
    <div style="position: fixed; bottom: 6rem; left: 0; font-size: 20px">
      <button onclick="window.scrollTo(0, window.innerHeight * 1)">2</button>
    </div>
    <div style="position: fixed; bottom: 3.5rem; left: 0; font-size: 20px">
      <button onclick="window.scrollTo(0, window.innerHeight * 2)">3</button>
    </div>
    <div style="position: fixed; bottom: 1rem; left: 0; font-size: 20px">
      <button onclick="window.scrollTo(0, window.innerHeight * 3)">4</button>
    </div>
  </body>
<html>
