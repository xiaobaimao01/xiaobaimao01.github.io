<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      iframe, body {
        width: 100vw;
        height: 100vh;
      }
      iframe {
        border: 0;
        padding: 0;
        margin: 0;
      }
      html, body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <iframe data-tab-content src="/cms/admin/?1" ></iframe>
    <iframe data-tab-content src="/cms/admin/?2" /></iframe>
    <iframe data-tab-content src="/cms/admin/?3" /></iframe>
    <script>
      window._tabs = document.querySelectorAll("[data-tab-content]")
    </script>
    <div style="position: fixed; bottom: 3rem; left: 0; font-size: 20px">
      <button onclick="window.scrollBy({top: -window.innerHeight})">Up</button>
    </div>
    <div style="position: fixed; bottom: 2rem; left: 0; font-size: 20px">
      <button onclick="window.scrollBy({top: window.innerHeight})">Do</button>
    </div>
  </body>
<html>
